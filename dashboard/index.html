  diag("Season/week from Sleeper: "+season+" / "+week+" (display_week="+nflState.display_week+", week="+nflState.week+"); league reception scoring="+recPoints+"; using "+scoreKey+" fallback plus league scoring settings");
  state.weeklyPPG={};state.weeklyProjection={};
  const summarize=(label,data)=>{const keys=data&&typeof data==="object"?Object.keys(data):[];const first=Array.isArray(data)?data[0]:(keys.length?data[keys[0]]:null);diag(label+": type="+(Array.isArray(data)?"array":typeof data)+", rows="+(Array.isArray(data)?data.length:keys.length)+", first keys="+(first&&typeof first==="object"?Object.keys(first).join(", "):String(first)));};
  try{
   const totals={},counts={},lastWeek=Math.max(1,Math.min(week,18));
   const statWeeks=await Promise.all(Array.from({length:lastWeek},(_,i)=>getJSON("https://api.sleeper.com/stats/nfl/"+season+"/"+(i+1)+"?season_type=regular").catch(err=>{diag("Stats week "+(i+1)+" ERROR: "+err.message);return null})));
   state.weeklyHistory={};
   for(let wi=0;wi<statWeeks.length;wi++){
    const stats=statWeeks[wi];if(!stats||typeof stats!=="object")continue;
    if(wi===0)summarize("Stats response",stats);
    const entries=Array.isArray(stats)?stats.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(stats);
    for(const [key,s] of entries){
     const pid=String(s?.player_id??s?.playerId??s?.id??key);
     const row=s?.stats&&typeof s.stats==="object"?s.stats:s;
     if(pid.startsWith("TEAM_"))continue;
     const customPts=leaguePointsFromStats(row);
     const raw=customPts!==null?customPts:(row?.[scoreKey]??row?.pts_ppr??row?.pts_half_ppr??row?.pts_std);
     if(raw===undefined||raw===null)continue;
     const pts=Number(raw);if(!Number.isFinite(pts))continue;
     (state.weeklyHistory[pid]||(state.weeklyHistory[pid]=[])).push({week:wi+1,points:pts,stats:row});
     totals[pid]=(totals[pid]||0)+pts;counts[pid]=(counts[pid]||0)+1;
    }
   }
   for(const [pid,total] of Object.entries(totals))if(counts[pid])state.weeklyPPG[pid]=total/counts[pid];
   diag("PPG player rows parsed="+Object.keys(state.weeklyPPG).length);
   if(Number(season)>2025){const oldTotals={},oldCounts={},oldWeeks=await Promise.all(Array.from({length:18},(_,i)=>getJSON("https://api.sleeper.com/stats/nfl/2025/"+(i+1)+"?season_type=regular").catch(()=>null)));for(let wi=0;wi<oldWeeks.length;wi++){const data=oldWeeks[wi];if(!data||typeof data!=="object")continue;const rows=Array.isArray(data)?data.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(data);for(const [key,item] of rows){const pid=String(item?.player_id??item?.playerId??item?.id??key),row=item?.stats&&typeof item.stats==="object"?item.stats:item;if(pid.startsWith("TEAM_"))continue;const custom=leaguePointsFromStats(row),raw=custom!==null?custom:(row?.[scoreKey]??row?.pts_ppr??row?.pts_half_ppr??row?.pts_std),n=Number(raw);if(raw===undefined||raw===null||!Number.isFinite(n))continue;oldTotals[pid]=(oldTotals[pid]||0)+n;oldCounts[pid]=(oldCounts[pid]||0)+1}}for(const [pid,total] of Object.entries(oldTotals))if(oldCounts[pid])state.previousYearPPG[pid]=total/oldCounts[pid];diag("2025 PPG rows parsed="+Object.keys(state.previousYearPPG).length)}
  }catch(err){diag("Stats parsing ERROR: "+err.message)}
  try{
   const url="https://api.sleeper.com/projections/nfl/"+season+"/"+week+"?season_type=regular";
   const projections=await getJSON(url);summarize("Projection response",projections);
   const entries=Array.isArray(projections)?projections.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(projections||{});
   const scoring=league.scoring_settings||{};
   let projectionRows=0,missingProjectionPoints=0;
   for(const [key,p] of entries){
    const pid=String(p?.player_id??p?.playerId??p?.id??key),row=p?.stats&&typeof p.stats==="object"?p.stats:p;
    if(pid.startsWith("TEAM_"))continue;
    // Use Sleeper's own projected fantasy-point field for this league's scoring format.
    const raw=row?.[scoreKey];
    if(raw===undefined||raw===null){missingProjectionPoints++;continue}
    const points=Number(raw);if(!Number.isFinite(points))continue;
    state.weeklyProjection[pid]=points;projectionRows++;
   }
   diag("Sleeper projections parsed="+projectionRows+", missing points="+missingProjectionPoints);
   // Ask Sleeper for each week separately so the player modal can show weekly projection values when available.
   state.weeklyProjectionHistory={};
   state.weeklyProjectionHistory[week]={...state.weeklyProjection};
   const priorProjectionWeeks=await Promise.all(Array.from({length:Math.max(0,week-1)},(_,i)=>i+1).map(async historicalWeek=>{
    try{
     const historical=await getJSON("https://api.sleeper.com/projections/nfl/"+season+"/"+historicalWeek+"?season_type=regular");
     const historicalEntries=Array.isArray(historical)?historical.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(historical||{});
     const byPlayer={};
     for(const [key,item] of historicalEntries){
      const pid=String(item?.player_id??item?.playerId??item?.id??key),row=item?.stats&&typeof item.stats==="object"?item.stats:item;
      const raw=row?.[scoreKey]??row?.pts_ppr??row?.pts_half_ppr??row?.pts_std;
      const value=Number(raw);
      if(!pid.startsWith("TEAM_")&&raw!==undefined&&raw!==null&&Number.isFinite(value))byPlayer[pid]=value;
     }
     return [historicalWeek,byPlayer];
    }catch(err){diag("Historical projections unavailable for week "+historicalWeek+": "+err.message);return [historicalWeek,{}]}
   }));
   for(const [historicalWeek,byPlayer] of priorProjectionWeeks)state.weeklyProjectionHistory[historicalWeek]=byPlayer;
   diag("Historical projection weeks loaded="+Object.keys(state.weeklyProjectionHistory).filter(w=>Object.keys(state.weeklyProjectionHistory[w]||{}).length).length);
   captureOriginalProjections(id,season,week);
   diag("Projection player rows parsed="+Object.keys(state.weeklyProjection).length);
  }catch(err){diag("Projection ERROR: "+err.message)}
  diag("Player dictionary IDs="+Object.keys(state.players).length+"; PPG IDs="+Object.keys(state.weeklyPPG).length+"; projection IDs="+Object.keys(state.weeklyProjection).length);
  try{const usageData=await getJSON("./data/usage-trends.json");state.usageTrends=Number(usageData?.season)===Number(league.season)?(usageData.players||{}):{};diag("Usage trend rows loaded="+Object.keys(state.usageTrends).length)}catch(e){state.usageTrends={};diag("Usage trend data unavailable: "+e.message)}
  status((league.name||leagueNames[id]||"League")+" loaded · "+rosters.length+" teams · refreshed "+new Date().toLocaleTimeString());
  render();
 }catch(e){status("Could not load data: "+e.message+". Check your connection and try Refresh.");$("#content").innerHTML='<div class="section"><div class="empty">If this persists, the browser may be blocking Sleeper API requests. We can add a small backend if needed.</div></div>'}
}
$("#league").addEventListener("change",()=>{state.selectedRoster="";load()});
$("#team").addEventListener("change",e=>{state.selectedRoster=e.target.value;render()});
$("#refresh").addEventListener("click",load);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));state.tab=b.dataset.tab;render()}));
 $("#content").addEventListener("click",e=>{const b=e.target.closest("[data-expand]");if(b){const k=b.dataset.expand;state.expandedMatchupTeams[k]=!state.expandedMatchupTeams[k];render()}});
$("#content").addEventListener("click",async e=>{const rank=e.target.closest("[data-ranking]");if(rank){openRanking(rank.dataset.ranking);return}const week=e.target.closest("[data-week]");if(week){state.matchupWeek=Math.max(1,Math.min(18,(state.matchupWeek||state.nflWeek||1)+Number(week.dataset.week)));status("Loading week "+state.matchupWeek+" matchup…");try{state.matchups=await getJSON("https://api.sleeper.app/v1/league/"+state.league.league_id+"/matchups/"+state.matchupWeek)}catch(err){state.matchups=[]}render()}});
load();
</script>
