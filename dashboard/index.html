lumn:1/-1;font-size:9px;line-height:1.2}.matchup-right .matchup-score-stack{align-items:flex-start}.matchup-right .matchup-actual,.matchup-right .matchup-projection{text-align:left}

<body>
<header><div class="wrap"><h1>🏈 Sleeper GM</h1><p>Your mobile fantasy football command center</p></div></header>
<main>
<div class="controls">
  <div><label for="league">League</label><select id="league"><option value="1313702361549529088">League 1</option><option value="1313937831093080064">League 2</option></select></div>
  <div><label for="team">Team</label><select id="team"><option value="">Loading teams…</option></select></div>
</div>
<button class="primary" id="refresh">↻ Refresh league data</button>
<div class="status" id="status" role="status">Ready to load your league.</div>
<nav aria-label="Dashboard sections"><button class="active" data-tab="team">My Team</button><button data-tab="matchup">Matchup</button><button data-tab="waivers">Waiver Wire</button><button data-tab="trades">Trade Analyzer</button></nav>
<div id="content"></div>
<p class="note">League and roster data from Sleeper. Market values: <a href="https://statsguyfantasy.com" target="_blank" rel="noopener" style="color:var(--accent)">Stats Guy Fantasy</a>. Pickup-fit scores are estimates, not fantasy-point projections. This app does not make roster or league changes.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const state={league:null,rosters:[],users:[],players:{},marketPlayers:{},weeklyPPG:{},weeklyProjection:{},weeklyActual:{},weeklyHistory:{},schedule:{},matchups:[],matchupWeek:0,nflWeek:1,marketAsOf:"",marketError:"",selectedRoster:"",showOptimalLineup:true,tab:"team",waiverPos:"ALL",waiverSearch:"",cutSuggestionFor:""};
const leagueNames={"1313702361549529088":"League 1","1313937831093080064":"League 2"};
function status(s){$("#status").textContent=s}
function diag(s){console.info("[Sleeper GM]",s)}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(url+" → HTTP "+r.status);return r.json()}
function playerName(id){const p=state.players[id];if(!p)return "Player "+id;return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player "+id)}
function userFor(roster){return state.users.find(u=>u.user_id===roster.owner_id)||{}}
function points(roster){const starters=(roster.starters||[]).length;return starters}
function maxPF(roster){const s=roster.settings||{};return (Number(s.ppts)||0)+(Number(s.ppts_decimal)||0)/100}
function ordinal(n){return n%100>=11&&n%100<=13?n+"th":n+({1:"st",2:"nd",3:"rd"}[n%10]||"th")}
function rosterName(r){const u=userFor(r);return u.metadata?.team_name||u.display_name||u.username||("Roster "+r.roster_id)}
function openRanking(kind){const back=document.createElement("div");back.className="player-modal-backdrop";const title=kind==="standings"?"Current standings":kind==="maxpf"?"Max PF — draft order":"Future dynasty outlook";back.innerHTML='<section class="player-modal" role="dialog" aria-modal="true"><div class="player-modal-head"><h2>'+title+'</h2><button class="player-modal-close">Close ✕</button></div><div class="player-modal-body"></div></section>';document.body.appendChild(back);const close=()=>back.remove();back.addEventListener("click",e=>{if(e.target===back)close()});back.querySelector(".player-modal-close").addEventListener("click",close);const body=back.querySelector(".player-modal-body");const teams=state.rosters.map(r=>{const ids=(r.players||[]).map(String);let value=0,young=0;for(const id of ids){const m=state.marketPlayers[id]||{},p=state.players[id]||{},v=Math.max(0,Number(m.value?.sf_dynasty)||0),age=Number(m.age??p.age);value+=v;if(age>0&&age<=25)young+=v}return {r,value,youngShare:value?young/value:0}});const sorted=kind==="standings"?state.rosters.slice().sort((a,b)=>(Number(b.settings?.wins)||0)-(Number(a.settings?.wins)||0)||(Number(b.settings?.fpts)||0)-(Number(a.settings?.fpts)||0)):kind==="maxpf"?state.rosters.slice().sort((a,b)=>maxPF(b)-maxPF(a)):teams.slice().sort((a,b)=>((b.value/(Math.max(1,...teams.map(x=>x.value)))*.7+b.youngShare*.3)-(a.value/(Math.max(1,...teams.map(x=>x.value)))*.7+a.youngShare*.3))).map(x=>x.r);body.innerHTML=sorted.map((r,i)=>{const mine=String(r.roster_id)===String(state.selectedRoster),t=teams.find(x=>String(x.r.roster_id)===String(r.roster_id));const value=kind==="standings"?(Number(r.settings?.wins)||0)+"-"+(Number(r.settings?.losses)||0)+(r.settings?.ties?"-"+r.settings.ties:"")+" · "+(Number(r.settings?.fpts)||0).toFixed(1)+" PF":kind==="maxpf"?maxPF(r).toFixed(2)+" Max PF":(t?.value||0).toLocaleString()+" value · "+Math.round((t?.youngShare||0)*100)+"% young";return '<div class="rank-row '+(mine?"mine":"")+'"><span>'+ordinal(i+1)+'</span><span>'+esc(rosterName(r))+(mine?" · YOU":"")+'</span><span style="font-size:12px;text-align:right">'+esc(value)+'</span></div>'}).join("")||'<div class="empty">No ranking data.</div>'}
function render(){
 const content=$("#content");
 if(state.tab==="matchup"){renderMatchup(content);return}
  if(state.tab==="waivers"){
  if(!Object.keys(state.players).length){
   content.innerHTML='<div class="section"><h2>Available Players</h2><div class="empty">Player data has not loaded yet. Tap Refresh league data and try again.</div></div>';
   return;
  }
  const rostered=new Set();
  state.rosters.forEach(r=>(r.players||[]).forEach(id=>rostered.add(String(id))));
  const positions=new Set(["QB","RB","WR","TE"]);
  const query=state.waiverSearch.trim().toLowerCase();
  const roster=state.rosters.find(r=>String(r.roster_id)===String(state.selectedRoster));
  const counts={QB:0,RB:0,WR:0,TE:0},starterCounts={QB:0,RB:0,WR:0,TE:0},injuredCounts={QB:0,RB:0,WR:0,TE:0};
  (roster?.players||[]).forEach(id=>{const p=state.players[id];if(p&&counts[p.position]!==undefined){counts[p.position]++;const status=String(p.injury_status||"").toLowerCase();if(status.includes("out")||status.includes("ir")||status.includes("injured"))injuredCounts[p.position]++}});
  (roster?.starters||[]).forEach(id=>{const p=state.players[id];if(p&&starterCounts[p.position]!==undefined)starterCounts[p.position]++});
  const slots=(state.league?.roster_positions||[]).map(s=>String(s).toUpperCase());
  const flexSlots=slots.filter(s=>["FLEX","REC_FLEX","WRRB_FLEX","SUPER_FLEX","SUPERFLEX"].includes(s)).length;
  const hasSuperflex=slots.some(s=>s==="SUPER_FLEX"||s==="SUPERFLEX");
  const baseStarts={QB:slots.filter(s=>s==="QB").length,RB:slots.filter(s=>s==="RB").length,WR:slots.filter(s=>s==="WR").length,TE:slots.filter(s=>s==="TE").length};
  const targets={QB:Math.max(3,baseStarts.QB+(hasSuperflex?2:1)),RB:Math.max(5,baseStarts.RB+flexSlots+2),WR:Math.max(5,baseStarts.WR+flexSlots+2),TE:Math.max(2,baseStarts.TE+1)};
  const needScore=pos=>{const target=targets[pos]||2,have=counts[pos]||0,starting=starterCounts[pos]||0,required=baseStarts[pos]||0;const depthGap=Math.max(0,(target-have)/target);const starterGap=Math.max(0,(required-starting)/Math.max(1,required));const injuryPressure=Math.min(.5,(injuredCounts[pos]||0)*.16);return Math.round(Math.max(0,Math.min(100,depthGap*55+starterGap*30+injuryPressure*30)))};
  const free=[];
  for(const [id,p] of Object.entries(state.players)){
   if(!p||rostered.has(String(id))||!positions.has(p.position)||p.active===false) continue;
   if(["Inactive","Retired"].includes(p.status)) continue;
   const name=p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player "+id);
   if(state.waiverPos!=="ALL"&&p.position!==state.waiverPos) continue;
   if(query&&!name.toLowerCase().includes(query)&&!(p.team||"").toLowerCase().includes(query)) continue;
   const market=state.marketPlayers[String(id)]||null;
   const value=Number(market?.value?.sf_dynasty)||0;
   const marketScore=Math.max(0,Math.min(100,Math.log10(value+1)*22));
   const need=needScore(p.position);
   const pickupScore=Math.round(need*.75+marketScore*.25);
   const change=market?.valueChange?.sf_dynasty?.days30;
   const trend=change==null?"Trend unavailable":change>0?"Trending up":change<0?"Trending down":"Holding steady";
   const trendIcon=change==null?"":change>0?" ↗":change<0?" ↘":" →";
   const age=Number(market?.age??p.age);
   const avgPoints=state.weeklyPPG[String(id)];const projectedPoints=state.weeklyProjection[String(id)];

 };

 content.innerHTML='<div class="section"><div class="week-control"><button data-week="-1" aria-label="Previous week">‹</button><strong>Week '+week+'</strong><button data-week="1" aria-label="Next week">›</button></div><div class="matchup-score"><div><strong>'+esc(rosterName(r))+'</strong><div class="matchup-points">'+pts(pair).toFixed(2)+'</div><div class="sub">'+proj(r).toFixed(2)+' projected</div></div><strong>VS</strong><div><strong>'+esc(opp?rosterName(opp):'Opponent TBD')+'</strong><div class="matchup-points">'+(opp?pts(opponent).toFixed(2):'—')+'</div><div class="sub">'+(opp?proj(opp).toFixed(2):'—')+' projected</div></div></div></div><h2 style="font-size:16px;margin:16px 0 8px">Starter comparison</h2>'+(comparisons||'<div class="empty">No starter slots available.</div>')+'<div class="section"><h2>Opponent strength</h2><div class="team"><div class="teamhead"><span>Record</span><span>'+(opp?(Number(opp.settings&&opp.settings.wins)||0)+'-'+(Number(opp.settings&&opp.settings.losses)||0):'—')+'</span></div><div class="sub">Max PF: '+(opp?maxPF(opp).toFixed(2):'—')+' · Dynasty value: '+(opp?val(opp).toLocaleString():'—')+'</div></div></div>';
}

 body.innerHTML='<h3 style="font-size:15px">Fantasy player news</h3><div class="empty">Looking up fantasy news for '+esc(name)+'…</div>';

document.addEventListener("click",e=>{const b=e.target.closest("[data-player]");if(!b)return;const panel=b.dataset.panel||(b.classList.contains("player-name-open")?"news":"");if(panel)openPlayerPanel(b.dataset.player,panel)});
async function load(){
 const id=$("#league").value;state.tab=document.querySelector("nav button.active")?.dataset.tab||"team";
 $("#content").innerHTML="";status("Loading league, rosters, and player data…");
 try{
  const league=await getJSON("https://api.sleeper.app/v1/league/"+id);
  const [rosters,users]=await Promise.all([getJSON("https://api.sleeper.app/v1/league/"+id+"/rosters"),getJSON("https://api.sleeper.app/v1/league/"+id+"/users")]);
  state.league=league;state.rosters=rosters;state.users=users;
  $("#team").innerHTML=rosters.map(r=>{const u=users.find(x=>x.user_id===r.owner_id)||{};return '<option value="'+r.roster_id+'">'+esc(u.display_name||u.username||("Roster "+r.roster_id))+'</option>'}).join("");
  if(!rosters.some(r=>String(r.roster_id)===String(state.selectedRoster)))state.selectedRoster=String(rosters[0]?.roster_id||"");
  $("#team").value=state.selectedRoster;
  status("League loaded. Fetching player names and dynasty values…");
  if(!Object.keys(state.players).length){state.players=await getJSON("https://api.sleeper.app/v1/players/nfl")}
  try{const market=await getJSON("https://api.statsguyfantasy.com/api/v1/players?tep=blend");state.marketPlayers=Object.fromEntries((market.players||[]).map(p=>[String(p.id),p]));state.marketAsOf=market.valuesAsOf?.sf_dynasty||"";state.marketError=""}catch(err){state.marketError=err.message}
  state.schedule={};
  try{
   const nflStateForSchedule=await getJSON("https://api.sleeper.app/v1/state/nfl").catch(()=>({}));
   const scheduleSeason=Number(nflStateForSchedule.season)||new Date().getFullYear();
   const scheduleWeek=Number(nflStateForSchedule.week)||Number(nflStateForSchedule.display_week)||1;
   const board=await getJSON("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week="+scheduleWeek+"&seasontype=2&season="+scheduleSeason);
   for(const event of board.events||[]){
    const comp=event.competitions&&event.competitions[0],teams=comp?.competitors||[];
    const home=teams.find(t=>t.homeAway==="home")?.team?.abbreviation,away=teams.find(t=>t.homeAway==="away")?.team?.abbreviation;
    if(!home||!away)continue;
    for(const team of [home,away])state.schedule[team]={home,away,date:event.date};
   }
  }catch(err){diag("Schedule unavailable: "+err.message)}
  const nflState=await getJSON("https://api.sleeper.app/v1/state/nfl").catch(()=>({}));
   // Prefer display_week because it represents the week currently shown in Sleeper's UI.
   const week=Number(nflState.display_week)||Number(nflState.week)||1;
   state.nflWeek=week;if(!state.matchupWeek)state.matchupWeek=week;
   try{state.matchups=await getJSON("https://api.sleeper.app/v1/league/"+id+"/matchups/"+state.matchupWeek)}catch(e){state.matchups=[]}
   state.weeklyActual={};
   // Fetch actual points for the current NFL display week, independently of the matchup-page week selector.
   try{
    const actualMatchups=await getJSON("https://api.sleeper.app/v1/league/"+id+"/matchups/"+week);
    for(const matchup of actualMatchups||[]){
     const playerPoints=matchup?.players_points||matchup?.starters_points||{};
     for(const [pid,value] of Object.entries(playerPoints)){const points=Number(value);if(Number.isFinite(points))state.weeklyActual[String(pid)]=points;}
    }
   }catch(err){diag("Actual points unavailable: "+err.message)}
  const season=Number(nflState.season)||new Date().getFullYear();
  const recPoints=Number(league.scoring_settings?.rec??1),scoreKey=recPoints===0?"pts_std":recPoints===0.5?"pts_half_ppr":"pts_ppr";
  diag("Season/week from Sleeper: "+season+" / "+week+" (display_week="+nflState.display_week+", week="+nflState.week+"); league reception scoring="+recPoints+"; using "+scoreKey);
  state.weeklyPPG={};state.weeklyProjection={};
  const summarize=(label,data)=>{const keys=data&&typeof data==="object"?Object.keys(data):[];const first=Array.isArray(data)?data[0]:(keys.length?data[keys[0]]:null);diag(label+": type="+(Array.isArray(data)?"array":typeof data)+", rows="+(Array.isArray(data)?data.length:keys.length)+", first keys="+(first&&typeof first==="object"?Object.keys(first).join(", "):String(first)));};
  try{
   const totals={},counts={},lastWeek=Math.max(1,Math.min(week,18));
   const statWeeks=await Promise.all(Array.from({length:lastWeek},(_,i)=>getJSON("https://api.sleeper.com/stats/nfl/"+season+"/"+(i+1)+"?season_type=regular").catch(err=>{diag("Stats week "+(i+1)+" ERROR: "+err.message);return null})));
   state.weeklyHistory={};
   for(let wi=0;wi<statWeeks.length;wi++){
    const stats=statWeeks[wi];if(!stats||typeof stats!=="object")continue;
    if(wi===0)summarize("Stats response",stats);
    const entries=Array.isArray(stats)?stats.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(stats);
    for(const [key,s] of entries){
     const pid=String(s?.player_id??s?.playerId??s?.id??key);
     const row=s?.stats&&typeof s.stats==="object"?s.stats:s;
     const raw=row?.[scoreKey]??row?.pts_ppr??row?.pts_half_ppr??row?.pts_std;
     if(raw===undefined||raw===null||pid.startsWith("TEAM_"))continue;
     const pts=Number(raw);if(!Number.isFinite(pts))continue;
     (state.weeklyHistory[pid]||(state.weeklyHistory[pid]=[])).push({week:wi+1,points:pts});

    }
   }
   for(const [pid,total] of Object.entries(totals))if(counts[pid])state.weeklyPPG[pid]=total/counts[pid];
   diag("PPG player rows parsed="+Object.keys(state.weeklyPPG).length);
  }catch(err){diag("Stats parsing ERROR: "+err.message)}
  try{
   const url="https://api.sleeper.com/projections/nfl/"+season+"/"+week+"?season_type=regular";
   const projections=await getJSON(url);summarize("Projection response",projections);
   const entries=Array.isArray(projections)?projections.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(projections||{});
   const scoring=league.scoring_settings||{};
   const nonStatKeys=new Set(["player_id","playerId","id","team","position","player","name","game_id","game","season","week","season_type","status","injury_status","pts_std","pts_half_ppr","pts_ppr"]);
   const customProjectionPoints=row=>{
    let total=0,matched=0;
    for(const [key,multiplierValue] of Object.entries(scoring)){
     const multiplier=Number(multiplierValue);
     if(!Number.isFinite(multiplier)||multiplier===0||key.startsWith("pts_")||key.startsWith("adp_")||key.startsWith("pos_rank_")||nonStatKeys.has(key))continue;
     if(!Object.prototype.hasOwnProperty.call(row,key))continue;
     const value=Number(row[key]);if(!Number.isFinite(value))continue;
     total+=value*multiplier;matched++;
    }
    return matched?{points:total,matched}:null;
   };
   const projectionDiagnostics={customScored:0,standardFallback:0,missingPoints:0};
   for(const [key,p] of entries){
    const pid=String(p?.player_id??p?.playerId??p?.id??key),row=p?.stats&&typeof p.stats==="object"?p.stats:p;
    if(pid.startsWith("TEAM_"))continue;
    const custom=customProjectionPoints(row);
    const generic=row?.[scoreKey]??row?.pts_ppr??row?.pts_half_ppr??row?.pts_std;
    const raw=custom?custom.points:generic;
    if(raw===undefined||raw===null){projectionDiagnostics.missingPoints++;continue}
    const points=Number(raw);if(!Number.isFinite(points))continue;
    state.weeklyProjection[pid]=points;
    if(custom)projectionDiagnostics.customScored++;else projectionDiagnostics.standardFallback++;
   }
   diag("Projection scoring: custom="+projectionDiagnostics.customScored+", fallback="+projectionDiagnostics.standardFallback+", missing="+projectionDiagnostics.missingPoints);
   diag("Projection player rows parsed="+Object.keys(state.weeklyProjection).length);
  }catch(err){diag("Projection ERROR: "+err.message)}
  diag("Player dictionary IDs="+Object.keys(state.players).length+"; PPG IDs="+Object.keys(state.weeklyPPG).length+"; projection IDs="+Object.keys(state.weeklyProjection).length);
  status((league.name||leagueNames[id]||"League")+" loaded · "+rosters.length+" teams · refreshed "+new Date().toLocaleTimeString());
  render();
 }catch(e){status("Could not load data: "+e.message+". Check your connection and try Refresh.");$("#content").innerHTML='<div class="section"><div class="empty">If this persists, the browser may be blocking Sleeper API requests. We can add a small backend if needed.</div></div>'}
}
$("#league").addEventListener("change",()=>{state.selectedRoster="";load()});
$("#team").addEventListener("change",e=>{state.selectedRoster=e.target.value;render()});
$("#refresh").addEventListener("click",load);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));state.tab=b.dataset.tab;render()}));
$("#content").addEventListener("click",async e=>{const rank=e.target.closest("[data-ranking]");if(rank){openRanking(rank.dataset.ranking);return}const week=e.target.closest("[data-week]");if(week){state.matchupWeek=Math.max(1,Math.min(18,(state.matchupWeek||state.nflWeek||1)+Number(week.dataset.week)));status("Loading week "+state.matchupWeek+" matchup…");try{state.matchups=await getJSON("https://api.sleeper.app/v1/league/"+state.league.league_id+"/matchups/"+state.matchupWeek)}catch(err){state.matchups=[]}render()}});
load();
</script>
