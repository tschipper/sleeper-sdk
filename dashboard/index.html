<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Sleeper GM</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--panel2:#1b2940;--line:#2b3a52;--text:#edf3fb;--muted:#9fb0c7;--accent:#7dd3fc;--green:#86efac;--red:#fca5a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px 16px;background:linear-gradient(140deg,#15263e,#0b1220);border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:auto}h1{margin:0;font-size:25px;letter-spacing:-.5px}header p{margin:5px 0 0;color:var(--muted);font-size:13px}
main{max-width:900px;margin:auto;padding:16px; padding-bottom:40px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px}
button{cursor:pointer;font-weight:650}button.primary{background:#075985;border-color:#0284c7}
.status{color:var(--muted);font-size:13px;padding:8px 2px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}
.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}
.kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.value{font-size:22px;font-weight:750;margin-top:3px;overflow-wrap:anywhere}
.section{margin-top:12px;padding:0;overflow:hidden}.section h2{font-size:16px;margin:0;padding:14px;border-bottom:1px solid var(--line)}
.team{padding:12px 14px;border-bottom:1px solid #25334a}.team:last-child{border-bottom:0}
.teamhead{display:flex;justify-content:space-between;gap:12px;font-weight:700}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:99px;color:var(--muted);white-space:nowrap}
.empty{padding:18px;color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
nav button{font-size:13px;padding:10px 5px;min-height:42px}
nav button.active{border-color:var(--accent);color:var(--accent);background:#102a3a}
.note{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:420px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.value{font-size:18px}.controls{grid-template-columns:1fr}.teamhead{font-size:14px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🏈 Sleeper GM</h1><p>Your mobile fantasy football command center</p></div></header>
<main>
<div class="controls">
  <div><label for="league">League</label><select id="league"><option value="1313702361549529088">League 1</option><option value="1313937831093080064">League 2</option></select></div>
  <div><label for="team">Team</label><select id="team"><option value="">Loading teams…</option></select></div>
</div>
<button class="primary" id="refresh">↻ Refresh league data</button>
<div class="status" id="status" role="status">Ready to load your league.</div>
<nav aria-label="Dashboard sections"><button class="active" data-tab="team">My Team</button><button data-tab="waivers">Waiver Wire</button><button data-tab="trades">Trade Analyzer</button></nav>
<div id="content"></div>
<p class="note">League and roster data from Sleeper. Market values: <a href="https://statsguyfantasy.com" target="_blank" rel="noopener" style="color:var(--accent)">Stats Guy Fantasy</a>. Pickup-fit scores are estimates, not fantasy-point projections. This app does not make roster or league changes.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const state={league:null,rosters:[],users:[],players:{},marketPlayers:{},weeklyPPG:{},weeklyProjection:{},marketAsOf:"",marketError:"",selectedRoster:"",tab:"team",waiverPos:"ALL",waiverSearch:""};
const leagueNames={"1313702361549529088":"League 1","1313937831093080064":"League 2"};
function status(s){$("#status").textContent=s}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error("Sleeper API returned "+r.status);return r.json()}
function playerName(id){const p=state.players[id];if(!p)return "Player "+id;return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player "+id)}
function userFor(roster){return state.users.find(u=>u.user_id===roster.owner_id)||{}}
function points(roster){const starters=(roster.starters||[]).length;return starters}
function render(){
 const content=$("#content");
 if(state.tab==="waivers"){
  if(!Object.keys(state.players).length){
   content.innerHTML='<div class="section"><h2>Available Players</h2><div class="empty">Player data has not loaded yet. Tap Refresh league data and try again.</div></div>';
   return;
  }
  const rostered=new Set();
  state.rosters.forEach(r=>(r.players||[]).forEach(id=>rostered.add(String(id))));
  const positions=new Set(["QB","RB","WR","TE"]);
  const query=state.waiverSearch.trim().toLowerCase();
  const roster=state.rosters.find(r=>String(r.roster_id)===String(state.selectedRoster));
  const counts={QB:0,RB:0,WR:0,TE:0};
  (roster?.players||[]).forEach(id=>{const p=state.players[id];if(p&&counts[p.position]!==undefined)counts[p.position]++});
  const targets={QB:3,RB:5,WR:5,TE:2};
  const needScore=pos=>Math.max(10,Math.min(100,((targets[pos]-counts[pos])/targets[pos])*100));
  const free=[];
  for(const [id,p] of Object.entries(state.players)){
   if(!p||rostered.has(String(id))||!positions.has(p.position)||p.active===false) continue;
   if(["Inactive","Retired"].includes(p.status)) continue;
   const name=p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player "+id);
   if(state.waiverPos!=="ALL"&&p.position!==state.waiverPos) continue;
   if(query&&!name.toLowerCase().includes(query)&&!(p.team||"").toLowerCase().includes(query)) continue;
   const market=state.marketPlayers[String(id)]||null;
   const value=Number(market?.value?.sf_dynasty)||0;
   const marketScore=Math.max(0,Math.min(100,value/100));
   const need=needScore(p.position);
   const pickupScore=Math.round(need*.6+marketScore*.4);
   const change=market?.valueChange?.sf_dynasty?.days30;
   const trend=change==null?"Trend unavailable":change>0?"Trending up":change<0?"Trending down":"Holding steady";
   const trendIcon=change==null?"":change>0?" ↗":change<0?" ↘":" →";
   const age=Number(market?.age??p.age);
   const avgPoints=state.weeklyPPG[String(id)];const projectedPoints=state.weeklyProjection[String(id)];
   free.push({id,p,name,market,value,need,marketScore,pickupScore,age,avgPoints,projectedPoints,trend,trendIcon,rank:Number(market?.rank?.sf_dynasty)||Number(p.search_rank)||99999,depth:Number(p.depth_chart_order)||99});
  }
  free.sort((a,b)=>b.pickupScore-a.pickupScore||b.value-a.value||a.rank-b.rank||a.name.localeCompare(b.name));
  const shown=free.slice(0,100);
  const rows=shown.map((x,i)=>'<div class="team"><div class="teamhead"><span>'+(i+1)+'. '+esc(x.name)+'</span><span class="pill">'+esc(x.p.position||"—")+' · '+x.pickupScore+'% fit</span></div><div class="sub">'+esc(x.p.team||x.market?.team||"Team unknown")+' · Age: '+(Number.isFinite(x.age)?x.age.toFixed(1):"N/A")+' · Avg points/game: '+(Number.isFinite(x.avgPoints)?x.avgPoints.toFixed(1):"N/A")+' · Week projection: '+(Number.isFinite(x.projectedPoints)?x.projectedPoints.toFixed(1):"N/A")+' · '+esc(x.trend)+esc(x.trendIcon)+(x.p.injury_status?' · Injury: '+esc(x.p.injury_status):'')+'</div><div class="sub">Roster need '+Math.round(x.need)+'% · Market value '+Math.round(x.marketScore)+'%</div><div style="height:5px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+x.pickupScore+'%;background:var(--green);border-radius:9px"></div></div>'+(x.market?.url?'<div class="sub"><a href="'+esc(x.market.url)+'" target="_blank" rel="noopener" style="color:var(--accent)">View Stats Guy Fantasy profile ↗</a></div>':'')+'</div>').join('');
  content.innerHTML='<div class="section"><h2>Recommended Pickups ('+free.length+(free.length===100?'+':'')+')</h2><div style="padding:12px;display:grid;gap:9px"><label for="waiver-search">Search player or NFL team</label><input id="waiver-search" value="'+esc(state.waiverSearch)+'" placeholder="e.g. Jaylen Warren" style="width:100%;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text)"><label for="waiver-pos">Position</label><select id="waiver-pos"><option value="ALL">All positions</option><option value="QB">QB</option><option value="RB">RB</option><option value="WR">WR</option><option value="TE">TE</option></select><div class="sub">Pickup fit is an estimate: 60% roster need and 40% Stats Guy Fantasy superflex dynasty market value. Need is estimated from roster depth targets (QB 3, RB 5, WR 5, TE 2). Trends reflect 30-day dynasty market-value change. '+(state.marketAsOf?'Market values as of '+esc(state.marketAsOf)+'.':(state.marketError?'Market values unavailable: '+esc(state.marketError):'Loading market values…'))+'</div></div>'+(rows||'<div class="empty">No players match those filters.</div>')+'</div>';
  $("#waiver-pos").value=state.waiverPos;
  $("#waiver-search").addEventListener("input",e=>{state.waiverSearch=e.target.value;const cursor=e.target.selectionStart;render();const el=$("#waiver-search");el.focus();el.setSelectionRange(cursor,cursor)});
  $("#waiver-pos").addEventListener("change",e=>{state.waiverPos=e.target.value;render()});
  return
 }
 if(state.tab==="trades"){content.innerHTML='<div class="section"><h2>Trade Analyzer</h2><div class="empty">Trade analysis is next. We will compare players against league scoring, roster needs, and future value rather than guessing at a trade grade.</div></div>';return}
 const r=state.rosters.find(x=>String(x.roster_id)===String(state.selectedRoster));
 if(!r){content.innerHTML='<div class="section"><div class="empty">Choose a team to view its roster.</div></div>';return}
 const starters=r.starters||[], reserve=r.reserve||[], taxi=r.taxi||[], all=r.players||[];
 const startersSet=new Set(starters);
 const bench=all.filter(id=>!startersSet.has(id)&&!reserve.includes(id)&&!taxi.includes(id));
 const user=userFor(r);
 const owner=user.display_name||user.username||("Roster "+r.roster_id);
 const wins=r.settings?.wins??0, losses=r.settings?.losses??0, ties=r.settings?.ties??0;
 const record=wins+"-"+losses+(ties?"-"+ties:"");
 const playerRows=(ids,emptyText)=>ids.length?ids.map(id=>'<div class="team"><div class="teamhead"><span>'+esc(playerName(id))+'</span><span class="pill">'+esc(pos(id))+'</span></div><div class="sub">'+esc(teamName(id))+'</div></div>').join(''):'<div class="empty">'+emptyText+'</div>';
 content.innerHTML='<div class="cards"><div class="card"><div class="kicker">Record</div><div class="value">'+record+'</div></div><div class="card"><div class="kicker">Rostered</div><div class="value">'+all.length+'</div></div><div class="card"><div class="kicker">Starters</div><div class="value">'+starters.length+'</div></div></div>'+
 '<div class="section"><h2>'+esc(owner)+' · Starters</h2>'+playerRows(starters,"No starters listed.")+'</div>'+
 '<div class="section"><h2>Bench</h2>'+playerRows(bench,"No bench players listed.")+'</div>'+
 (reserve.length?'<div class="section"><h2>Injured Reserve</h2>'+playerRows(reserve,"No IR players.")+'</div>':'')+
 (taxi.length?'<div class="section"><h2>Taxi Squad</h2>'+playerRows(taxi,"No taxi squad players.")+'</div>':'')+
 '<div class="section"><h2>League snapshot</h2><div class="team"><div class="teamhead"><span>League teams</span><span>'+state.rosters.length+'</span></div><div class="sub">Current roster data from Sleeper</div></div></div>';
}
function pos(id){const p=state.players[id];return p?.position||"—"}
function teamName(id){const p=state.players[id];return p?.team||"Free agent"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){
 const id=$("#league").value;state.tab=document.querySelector("nav button.active")?.dataset.tab||"team";
 $("#content").innerHTML="";status("Loading league, rosters, and player data…");
 try{
  const league=await getJSON("https://api.sleeper.app/v1/league/"+id);
  const [rosters,users]=await Promise.all([getJSON("https://api.sleeper.app/v1/league/"+id+"/rosters"),getJSON("https://api.sleeper.app/v1/league/"+id+"/users")]);
  state.league=league;state.rosters=rosters;state.users=users;
  $("#team").innerHTML=rosters.map(r=>{const u=users.find(x=>x.user_id===r.owner_id)||{};return '<option value="'+r.roster_id+'">'+esc(u.display_name||u.username||("Roster "+r.roster_id))+'</option>'}).join("");
  if(!rosters.some(r=>String(r.roster_id)===String(state.selectedRoster)))state.selectedRoster=String(rosters[0]?.roster_id||"");
  $("#team").value=state.selectedRoster;
  status("League loaded. Fetching player names and dynasty values…");
  if(!Object.keys(state.players).length){state.players=await getJSON("https://api.sleeper.app/v1/players/nfl")}
  try{const market=await getJSON("https://api.statsguyfantasy.com/api/v1/players?tep=blend");state.marketPlayers=Object.fromEntries((market.players||[]).map(p=>[String(p.id),p]));state.marketAsOf=market.valuesAsOf?.sf_dynasty||"";state.marketError=""}catch(err){state.marketError=err.message}
  try{const nflState=await getJSON("https://api.sleeper.app/v1/state/nfl");const season=Number(nflState.season)||new Date().getFullYear();const week=Number(nflState.week)||Number(nflState.display_week)||1;const [stats,projections]=await Promise.all([getJSON("https://api.sleeper.com/stats/nfl/"+season+"?season_type=regular"),getJSON("https://api.sleeper.com/projections/nfl/"+season+"/"+week+"?season_type=regular")]);state.weeklyPPG={};state.weeklyProjection={};const statRows=Array.isArray(stats)?stats:Object.entries(stats||{}).map(([player_id,v])=>({player_id,...(v||{})}));for(const s of statRows){const pid=String(s.player_id??s.playerId??s.id??"");const games=Number(s.gp??s.gms_active??s.games_played??s.games??0);const pts=Number(s.pts_ppr??s.pts_half_ppr??s.pts_std);if(pid&&games>0&&Number.isFinite(pts))state.weeklyPPG[pid]=pts/games}const projectionRows=Array.isArray(projections)?projections:Object.entries(projections||{}).map(([player_id,v])=>({player_id,...(v||{})}));for(const p of projectionRows){const pid=String(p.player_id??p.playerId??p.id??"");const points=Number(p.pts_ppr??p.pts_half_ppr??p.pts_std);if(pid&&Number.isFinite(points))state.weeklyProjection[pid]=points}}catch(err){state.weeklyPPG={};state.weeklyProjection={}}
  status((league.name||leagueNames[id]||"League")+" loaded · "+rosters.length+" teams · refreshed "+new Date().toLocaleTimeString());
  render();
 }catch(e){status("Could not load data: "+e.message+". Check your connection and try Refresh.");$("#content").innerHTML='<div class="section"><div class="empty">If this persists, the browser may be blocking Sleeper API requests. We can add a small backend if needed.</div></div>'}
}
$("#league").addEventListener("change",()=>{state.selectedRoster="";load()});
$("#team").addEventListener("change",e=>{state.selectedRoster=e.target.value;render()});
$("#refresh").addEventListener("click",load);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));state.tab=b.dataset.tab;render()}));
load();
</script>
</body></html>
