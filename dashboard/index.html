   const projections=await getJSON(url);if(!current())return;summarize("Projection response",projections);
   const entries=Array.isArray(projections)?projections.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(projections||{});
   const scoring=league.scoring_settings||{};
   let projectionRows=0,missingProjectionPoints=0;
   for(const [key,p] of entries){
    const pid=String(p?.player_id??p?.playerId??p?.id??key),row=p?.stats&&typeof p.stats==="object"?p.stats:p;
    if(pid.startsWith("TEAM_"))continue;
    // Prefer a complete league-specific calculation when Sleeper supplies every
    // configured scoring stat; otherwise use Sleeper's published standard-format total.
    const customPoints=leaguePointsFromStats(row);
    const raw=customPoints!==null?customPoints:(fallbackPoints(row)??(scoringFallbackSafe?(row?.proj_pts??row?.projected_points):null));
    if(raw===undefined||raw===null){missingProjectionPoints++;continue}
    const points=Number(raw);if(!Number.isFinite(points))continue;
    state.weeklyProjection[pid]=points;projectionRows++;
   }
   diag("Sleeper projections parsed="+projectionRows+", missing points="+missingProjectionPoints);
   // Ask Sleeper for each week separately so the player modal can show weekly projection values when available.
   state.weeklyProjectionHistory={};
   state.weeklyProjectionHistory[week]={...state.weeklyProjection};
   const priorProjectionWeeks=await Promise.all(Array.from({length:Math.min(18,week+3)},(_,i)=>i+1).filter(projectionWeek=>projectionWeek!==week).map(async historicalWeek=>{
    try{
     const historical=await getJSON("https://api.sleeper.com/projections/nfl/"+season+"/"+historicalWeek+"?season_type=regular");
     const historicalEntries=Array.isArray(historical)?historical.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(historical||{});
     const byPlayer={};
     for(const [key,item] of historicalEntries){
      const pid=String(item?.player_id??item?.playerId??item?.id??key),row=item?.stats&&typeof item.stats==="object"?item.stats:item;
      const customPoints=leaguePointsFromStats(row);
      const raw=customPoints!==null?customPoints:(row?.[scoreKey]??row?.pts_ppr??row?.pts_half_ppr??row?.pts_std??row?.proj_pts??row?.projected_points);
      const value=Number(raw);
      if(!pid.startsWith("TEAM_")&&raw!==undefined&&raw!==null&&Number.isFinite(value))byPlayer[pid]=value;
     }
     return [historicalWeek,byPlayer];
    }catch(err){diag("Historical projections unavailable for week "+historicalWeek+": "+err.message);return [historicalWeek,{}]}
   }));
   if(!current())return;for(const [historicalWeek,byPlayer] of priorProjectionWeeks)state.weeklyProjectionHistory[historicalWeek]=byPlayer;
   diag("Projection weeks loaded="+Object.keys(state.weeklyProjectionHistory).filter(w=>Object.keys(state.weeklyProjectionHistory[w]||{}).length).length);
   captureOriginalProjections(id,season,week);
   diag("Projection player rows parsed="+Object.keys(state.weeklyProjection).length);
  }catch(err){diag("Projection ERROR: "+err.message)}if(!current())return;
  diag("Player dictionary IDs="+Object.keys(state.players).length+"; PPG IDs="+Object.keys(state.weeklyPPG).length+"; projection IDs="+Object.keys(state.weeklyProjection).length);
  try{const usageData=await getJSON("./data/usage-trends.json");state.usageTrends=Number(usageData?.season)===Number(league.season)?(usageData.players||{}):{};diag("Usage trend rows loaded="+Object.keys(state.usageTrends).length)}catch(e){state.usageTrends={};diag("Usage trend data unavailable: "+e.message)}if(!current())return;status((league.name||leagueNames[id]||"League")+" loaded · "+rosters.length+" teams · refreshed "+new Date().toLocaleTimeString());
  render();
 }catch(e){if(!current())return;status("Could not load data: "+e.message+". Check your connection and try Refresh.");$("#content").innerHTML='<div class="section"><div class="empty">If this persists, the browser may be blocking Sleeper API requests. We can add a small backend if needed.</div></div>'}
}
$("#league").addEventListener("change",()=>{state.selectedRoster="";state.manualTrade=null;state.expandedMatchupTeams={};state.matchupWeek=0;state.matchupView="mine";state.cutSuggestionFor="";load()});
$("#team").addEventListener("change",e=>{state.selectedRoster=e.target.value;state.manualTrade=null;render()});
$("#refresh").addEventListener("click",load);
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));state.tab=b.dataset.tab;render()}));
 $("#content").addEventListener("click",e=>{const b=e.target.closest("[data-expand]");if(b){const k=b.dataset.expand;state.expandedMatchupTeams[k]=!state.expandedMatchupTeams[k];render()}});$("#content").addEventListener("change",e=>{if(e.target?.id==="matchup-view"){state.matchupView=e.target.value;render()}});
$("#content").addEventListener("click",async e=>{const rank=e.target.closest("[data-ranking]");if(rank){openRanking(rank.dataset.ranking);return}const week=e.target.closest("[data-week]");if(week){const request=++state.matchupLoadRequest,leagueId=String(state.league?.league_id||$("#league").value);state.matchupWeek=Math.max(1,Math.min(18,(state.matchupWeek||state.nflWeek||1)+Number(week.dataset.week)));const requestedWeek=state.matchupWeek;status("Loading week "+requestedWeek+" matchup…");try{const data=await getJSON("https://api.sleeper.app/v1/league/"+leagueId+"/matchups/"+requestedWeek);if(request!==state.matchupLoadRequest||leagueId!==String(state.league?.league_id||$("#league").value)||requestedWeek!==state.matchupWeek)return;state.matchups=data}catch(err){if(request!==state.matchupLoadRequest)return;state.matchups=[]}render()}});
load();
</script>
