<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>Sleeper GM</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141f31;--panel2:#1b2940;--line:#2b3a52;--text:#edf3fb;--muted:#9fb0c7;--accent:#7dd3fc;--green:#86efac;--red:#fca5a5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:22px 18px 16px;background:linear-gradient(140deg,#15263e,#0b1220);border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:auto}h1{margin:0;font-size:25px;letter-spacing:-.5px}header p{margin:5px 0 0;color:var(--muted);font-size:13px}
main{max-width:900px;margin:auto;padding:16px; padding-bottom:40px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}
select,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;min-height:46px}
button{cursor:pointer;font-weight:650}button.primary{background:#075985;border-color:#0284c7}
.status{color:var(--muted);font-size:13px;padding:8px 2px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin:12px 0}
.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:15px;padding:13px}
.kicker{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.value{font-size:22px;font-weight:750;margin-top:3px;overflow-wrap:anywhere}
.section{margin-top:12px;padding:0;overflow:hidden}.section h2{font-size:16px;margin:0;padding:14px;border-bottom:1px solid var(--line)}
.team{padding:9px 10px;border-bottom:1px solid #25334a}.team:last-child{border-bottom:0}
.teamhead{display:flex;align-items:center;gap:10px;font-weight:700;min-width:0}.sub{font-size:12px;color:var(--muted);margin-top:3px}
.pill{font-size:11px;border:1px solid var(--line);padding:3px 7px;border-radius:99px;color:var(--muted);white-space:nowrap}
.player-row{display:grid;grid-template-columns:48px minmax(0,1fr) auto;align-items:center;gap:7px;padding:7px 7px;background:linear-gradient(110deg,#14243a,#101c2e);border:1px solid #263d5c;border-radius:13px;margin:7px 8px}
.position-badge{display:flex;align-items:center;justify-content:center;min-height:29px;padding:5px 4px;border-radius:10px;background:#153b5c;color:#8bdcff;font-size:11px;font-weight:800;letter-spacing:.02em}
.position-QB{background:#4b203c;color:#ffb4d1}.position-RB{background:#174b39;color:#a7f3c2}.position-WR{background:#123e63;color:#a8ddff}.position-TE{background:#57351d;color:#ffd0a0}.position-FLEX,.position-SF,.position-IDP{background:#38245e;color:#d8b8ff}.position-BENCH{background:#273449;color:#bdc9d9}
.player-info{min-width:0}.player-name{font-size:14px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}.player-team{font-size:11px;color:var(--muted);font-weight:500;margin-left:5px}.player-meta{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.35}.game-meta{font-size:11px;color:#b7c9df;margin-top:4px;line-height:1.35}.projection-box{min-width:49px;text-align:center;padding:5px 5px;border-radius:10px;background:#1b2b42;border:1px solid #263b57}.projection-number{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}.projection-label{font-size:10px;color:var(--muted)}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}.section-head h2{border:0;padding:0}.section-total{font-size:12px;color:var(--muted);white-space:nowrap}
.empty{padding:18px;color:var(--muted);font-size:14px}
nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
nav button{font-size:13px;padding:10px 5px;min-height:42px}
nav button.active{border-color:var(--accent);color:var(--accent);background:#102a3a}
.player-actions{display:flex;gap:5px;align-items:center;margin-top:5px}.player-action{width:auto;min-height:28px;padding:4px 8px;font-size:11px;border-radius:8px;background:#1a2a40;color:var(--accent)}.player-modal-backdrop{position:fixed;inset:0;background:rgba(2,6,15,.78);z-index:99;display:flex;align-items:flex-end;justify-content:center;padding:10px}.player-modal{width:100%;max-width:650px;max-height:82vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:0 0 18px;box-shadow:0 15px 60px #0009}.player-modal-head{position:sticky;top:0;background:var(--panel);padding:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);z-index:1}.player-modal-head h2{font-size:17px;margin:0}.player-modal-body{padding:14px}.player-modal-close{width:auto;min-height:36px;padding:6px 12px}.history-row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}@media(min-width:600px){.player-modal-backdrop{align-items:center}}
.note{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:420px){.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.card{padding:10px}.value{font-size:18px}.controls{grid-template-columns:1fr}.teamhead{font-size:14px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🏈 Sleeper GM</h1><p>Your mobile fantasy football command center</p></div></header>
<main>
<div class="controls">
  <div><label for="league">League</label><select id="league"><option value="1313702361549529088">League 1</option><option value="1313937831093080064">League 2</option></select></div>
  <div><label for="team">Team</label><select id="team"><option value="">Loading teams…</option></select></div>
</div>
<button class="primary" id="refresh">↻ Refresh league data</button>
<div class="status" id="status" role="status">Ready to load your league.</div>
<nav aria-label="Dashboard sections"><button class="active" data-tab="team">My Team</button><button data-tab="waivers">Waiver Wire</button><button data-tab="trades">Trade Analyzer</button></nav>
<div id="content"></div>
<p class="note">League and roster data from Sleeper. Market values: <a href="https://statsguyfantasy.com" target="_blank" rel="noopener" style="color:var(--accent)">Stats Guy Fantasy</a>. Pickup-fit scores are estimates, not fantasy-point projections. This app does not make roster or league changes.</p>
</main>
<script>
const $=s=>document.querySelector(s);
const state={league:null,rosters:[],users:[],players:{},marketPlayers:{},weeklyPPG:{},weeklyProjection:{},weeklyHistory:{},schedule:{},marketAsOf:"",marketError:"",selectedRoster:"",showOptimalLineup:true,tab:"team",waiverPos:"ALL",waiverSearch:"",cutSuggestionFor:""};
const leagueNames={"1313702361549529088":"League 1","1313937831093080064":"League 2"};
function status(s){$("#status").textContent=s}
function diag(s){console.info("[Sleeper GM]",s)}
async function getJSON(url){const r=await fetch(url);if(!r.ok)throw new Error(url+" → HTTP "+r.status);return r.json()}
function playerName(id){const p=state.players[id];if(!p)return "Player "+id;return p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player "+id)}
function userFor(roster){return state.users.find(u=>u.user_id===roster.owner_id)||{}}
function points(roster){const starters=(roster.starters||[]).length;return starters}
function render(){
 const content=$("#content");
 if(state.tab==="waivers"){
  if(!Object.keys(state.players).length){
   content.innerHTML='<div class="section"><h2>Available Players</h2><div class="empty">Player data has not loaded yet. Tap Refresh league data and try again.</div></div>';
   return;
  }
  const rostered=new Set();
  state.rosters.forEach(r=>(r.players||[]).forEach(id=>rostered.add(String(id))));
  const positions=new Set(["QB","RB","WR","TE"]);
  const query=state.waiverSearch.trim().toLowerCase();
  const roster=state.rosters.find(r=>String(r.roster_id)===String(state.selectedRoster));
  const counts={QB:0,RB:0,WR:0,TE:0};
  (roster?.players||[]).forEach(id=>{const p=state.players[id];if(p&&counts[p.position]!==undefined)counts[p.position]++});
  const targets={QB:3,RB:5,WR:5,TE:2};
  const needScore=pos=>Math.max(10,Math.min(100,((targets[pos]-counts[pos])/targets[pos])*100));
  const free=[];
  for(const [id,p] of Object.entries(state.players)){
   if(!p||rostered.has(String(id))||!positions.has(p.position)||p.active===false) continue;
   if(["Inactive","Retired"].includes(p.status)) continue;
   const name=p.full_name||[p.first_name,p.last_name].filter(Boolean).join(" ")||("Player "+id);
   if(state.waiverPos!=="ALL"&&p.position!==state.waiverPos) continue;
   if(query&&!name.toLowerCase().includes(query)&&!(p.team||"").toLowerCase().includes(query)) continue;
   const market=state.marketPlayers[String(id)]||null;
   const value=Number(market?.value?.sf_dynasty)||0;
   const marketScore=Math.max(0,Math.min(100,value/100));
   const need=needScore(p.position);
   const pickupScore=Math.round(need*.6+marketScore*.4);
   const change=market?.valueChange?.sf_dynasty?.days30;
   const trend=change==null?"Trend unavailable":change>0?"Trending up":change<0?"Trending down":"Holding steady";
   const trendIcon=change==null?"":change>0?" ↗":change<0?" ↘":" →";
   const age=Number(market?.age??p.age);
   const avgPoints=state.weeklyPPG[String(id)];const projectedPoints=state.weeklyProjection[String(id)];
   free.push({id,p,name,market,value,need,marketScore,pickupScore,age,avgPoints,projectedPoints,trend,trendIcon,rank:Number(market?.rank?.sf_dynasty)||Number(p.search_rank)||99999,depth:Number(p.depth_chart_order)||99});
  }
  free.sort((a,b)=>b.pickupScore-a.pickupScore||b.value-a.value||a.rank-b.rank||a.name.localeCompare(b.name));
  const shown=free.slice(0,100);
  const cutTarget=()=>{if(!roster)return null;const starterIds=new Set((roster.starters||[]).map(String)),reserveIds=new Set((roster.reserve||[]).map(String)),taxiIds=new Set((roster.taxi||[]).map(String));const slots=(state.league?.roster_positions||[]).filter(s=>!["BN","IR","TAXI","RESERVE"].includes(String(s).toUpperCase()));const canonical=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,"");const eligible=(slot,p)=>{const s=canonical(slot),q=p?.position||"";if(["QB","RB","WR","TE","K","DEF"].includes(s))return q===s;if(["FLEX","RECFLEX"].includes(s))return ["RB","WR","TE"].includes(q);if(s==="WRRBFLEX")return ["RB","WR"].includes(q);if(s==="SUPERFLEX")return ["QB","RB","WR","TE"].includes(q);if(["IDPFLEX","FLEXIDP"].includes(s))return ["IDP","DL","LB","DB","DE","DT","CB","S","EDGE","NT"].includes(q);return false};const canFillLineup=excluded=>{const ids=(roster.players||[]).map(String).filter(pid=>pid!==excluded&&!reserveIds.has(pid)&&!taxiIds.has(pid));const candidates=ids.map(id=>({id,p:state.players[id]||{}}));const ordered=slots.map((slot,i)=>({slot,i,n:candidates.filter(x=>eligible(slot,x.p)).length})).sort((a,b)=>a.n-b.n||a.i-b.i);const used=new Set();for(const s of ordered){const pick=candidates.find(x=>!used.has(x.id)&&eligible(s.slot,x.p));if(!pick)return false;used.add(pick.id)}return true};const benchIds=(roster.players||[]).map(String).filter(pid=>!starterIds.has(pid)&&!reserveIds.has(pid)&&!taxiIds.has(pid));const ranked=benchIds.filter(pid=>canFillLineup(pid)).map(pid=>{const p=state.players[pid]||{},m=state.marketPlayers[pid]||{},v=Number(m?.value?.sf_dynasty)||0;return {id:pid,name:playerName(pid),position:p.position||"—",value:v,age:Number(m?.age??p.age),injury:p.injury_status||""}}).sort((a,b)=>a.value-b.value||(Number.isFinite(b.age)?b.age:0)-(Number.isFinite(a.age)?a.age:0));return ranked[0]||null};
  const rows=shown.map((x,i)=>{const cut=state.cutSuggestionFor===String(x.id)?cutTarget():null;const cutHtml=state.cutSuggestionFor===String(x.id)?(cut?'<div class="sub" style="margin-top:9px;padding:9px;background:#0d1928;border:1px solid var(--line);border-radius:9px"><strong>Possible cut: '+esc(cut.name)+'</strong> · '+esc(cut.position)+' · Dynasty value '+Math.round(cut.value)+(Number.isFinite(cut.age)?' · Age '+cut.age.toFixed(1):'')+(cut.injury?' · Injury: '+esc(cut.injury):'')+'<div style="margin-top:4px">This is your lowest-value non-starter outside IR and taxi. Review outlook and roster context before cutting.</div></div>':'<div class="sub">No eligible bench cut found. Starters, IR, and taxi players are excluded.</div>'):'';return '<div class="team"><div style="display:flex;align-items:center;gap:8px;justify-content:space-between"><div class="teamhead" style="flex:1;min-width:0"><span>'+(i+1)+'. <button class="player-name-open" data-player="'+esc(x.id)+'" style="display:inline;width:auto;min-height:0;padding:0;border:0;background:none;text-align:left;font-weight:750">'+esc(x.name)+'</button><button class="player-info-icon" data-player="'+esc(x.id)+'" data-panel="news" aria-label="Player info and recent updates" title="Player info and recent updates" style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;min-height:22px;padding:0;margin-left:3px;border-radius:50%;font-size:13px;background:#17334a;color:var(--accent);border:1px solid var(--accent)">i</button></span><span class="pill">'+esc(x.p.position||"—")+' · '+x.pickupScore+'% fit</span></div><button type="button" class="cut-suggest" data-player="'+esc(x.id)+'" style="width:auto;min-width:70px;min-height:34px;padding:6px 9px;font-size:11px;border-radius:9px;background:#35251d;border-color:#8a5a35;white-space:nowrap">Cut suggestion</button></div><div class="player-actions" style="margin:6px 0 2px"><button class="player-action" data-player="'+esc(x.id)+'" data-panel="news">ⓘ Updates</button><button class="player-action" data-player="'+esc(x.id)+'" data-panel="projections">▥ Stats & projections</button></div><div class="sub">'+esc(x.p.team||x.market?.team||"Team unknown")+' · Age: '+(Number.isFinite(x.age)?x.age.toFixed(1):"N/A")+' · Avg. PPG: '+(Number.isFinite(x.avgPoints)?x.avgPoints.toFixed(1):"N/A")+' · Week projection: <button class="player-action" data-player="'+esc(x.id)+'" data-panel="projections" style="display:inline;min-height:24px;padding:2px 6px">'+(Number.isFinite(x.projectedPoints)?x.projectedPoints.toFixed(1):"N/A")+' pts</button> · '+esc(x.trend)+esc(x.trendIcon)+(x.p.injury_status?' · Injury: '+esc(x.p.injury_status):'')+'</div><div class="sub">Roster need '+Math.round(x.need)+'% · Market value '+Math.round(x.marketScore)+'%</div><div style="height:5px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden"><div style="height:100%;width:'+x.pickupScore+'%;background:var(--green);border-radius:9px"></div></div>'+(x.market?.url?'<div class="sub"><a href="'+esc(x.market.url)+'" target="_blank" rel="noopener" style="color:var(--accent)">View Stats Guy Fantasy profile ↗</a></div>':'')+cutHtml+'</div>'}).join('');
  content.innerHTML='<div class="section"><h2>Recommended Pickups ('+free.length+(free.length===100?'+':'')+')</h2><div style="padding:12px;display:grid;gap:9px"><label for="waiver-search">Search player or NFL team</label><input id="waiver-search" value="'+esc(state.waiverSearch)+'" placeholder="e.g. Jaylen Warren" style="width:100%;padding:12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);color:var(--text)"><label for="waiver-pos">Position</label><select id="waiver-pos"><option value="ALL">All positions</option><option value="QB">QB</option><option value="RB">RB</option><option value="WR">WR</option><option value="TE">TE</option></select><div class="sub">Pickup fit is an estimate: 60% roster need and 40% Stats Guy Fantasy superflex dynasty market value. Need is estimated from roster depth targets (QB 3, RB 5, WR 5, TE 2). Trends reflect 30-day dynasty market-value change. '+(state.marketAsOf?'Market values as of '+esc(state.marketAsOf)+'.':(state.marketError?'Market values unavailable: '+esc(state.marketError):'Loading market values…'))+'</div></div>'+(rows||'<div class="empty">No players match those filters.</div>')+'</div>';
  $("#waiver-pos").value=state.waiverPos;
  $("#waiver-search").addEventListener("input",e=>{state.waiverSearch=e.target.value;const cursor=e.target.selectionStart;render();const el=$("#waiver-search");el.focus();el.setSelectionRange(cursor,cursor)});
  document.querySelectorAll(".cut-suggest").forEach(button=>button.addEventListener("click",()=>{state.cutSuggestionFor=state.cutSuggestionFor===button.dataset.player?"":button.dataset.player;render()}));
  $("#waiver-pos").addEventListener("change",e=>{state.waiverPos=e.target.value;render()});
  return
 }
 if(state.tab==="trades"){content.innerHTML='<div class="section"><h2>Trade Analyzer</h2><div class="empty">Trade analysis is next. We will compare players against league scoring, roster needs, and future value rather than guessing at a trade grade.</div></div>';return}
 const r=state.rosters.find(x=>String(x.roster_id)===String(state.selectedRoster));
 if(!r){content.innerHTML='<div class="section"><div class="empty">Choose a team to view its roster.</div></div>';return}
 const starters=r.starters||[], reserve=r.reserve||[], taxi=r.taxi||[], all=r.players||[];
 const startersSet=new Set(starters);
 const bench=all.filter(id=>!startersSet.has(id)&&!reserve.includes(id)&&!taxi.includes(id));
 const user=userFor(r);
 const owner=user.display_name||user.username||("Roster "+r.roster_id);
 const wins=r.settings?.wins??0, losses=r.settings?.losses??0, ties=r.settings?.ties??0;
 const record=wins+"-"+losses+(ties?"-"+ties:"");
 const playerMarketValue=id=>Math.max(0,Number(state.marketPlayers[String(id)]?.value?.sf_dynasty)||0);
 const playerAge=id=>{const p=state.players[String(id)]||{},m=state.marketPlayers[String(id)]||{},a=Number(m.age??p.age);return Number.isFinite(a)&&a>0?a:null};
 const rosterValue=ids=>ids.reduce((sum,id)=>sum+playerMarketValue(id),0);
 const strength=rosterValue(all);
 const teamOutlook=team=>{const ids=(team.players||[]).map(String),value=rosterValue(ids);let youngValue=0,ageValue=0,agedValue=0;for(const id of ids){const v=playerMarketValue(id),age=playerAge(id);if(age!==null){ageValue+=age*v;agedValue+=v;if(age<=25)youngValue+=v}}return {id:String(team.roster_id),value,youngValue,youngShare:value?youngValue/value:0,weightedAge:agedValue?ageValue/agedValue:null}};
 const outlooks=state.rosters.map(teamOutlook);
 const currentOutlook=outlooks.find(x=>x.id===String(r.roster_id))||teamOutlook(r);
 const leagueValues=outlooks.slice().sort((a,b)=>a.value-b.value);
 const rankIndex=leagueValues.findIndex(team=>team.id===String(r.roster_id));
 const percentile=leagueValues.length>1?Math.round((rankIndex/(leagueValues.length-1))*100):50;
 const youthValues=outlooks.map(x=>x.youngShare).sort((a,b)=>a-b);
 const youthRank=youthValues.filter(x=>x<=currentOutlook.youngShare).length-1;
 const youthPercentile=youthValues.length>1?Math.round(Math.max(0,youthRank)/(youthValues.length-1)*100):50;
 const futureScore=Math.round(percentile*.7+youthPercentile*.3);
 const futureLabel=futureScore>=80?"Excellent":futureScore>=60?"Strong":futureScore>=40?"Average":futureScore>=20?"Concerning":"Declining";
 const futureDetail=(currentOutlook.youngShare>=.45?"Strong young core":currentOutlook.youngShare>=.25?"Some young dynasty assets":"Value concentrated in older/prime assets")+(currentOutlook.weightedAge!==null?" · Value-weighted age "+currentOutlook.weightedAge.toFixed(1):" · Age data limited");
 const projectedStarterPoints=starters.reduce((sum,id)=>sum+(Number.isFinite(state.weeklyProjection[String(id)])?state.weeklyProjection[String(id)]:0),0);
 const rebuildLabel=futureLabel;
 const strengthLabel=state.marketAsOf?"Current dynasty value":"Market values unavailable";
 const slotLabel=s=>({FLEX_IDP:"IDP Flex",IDP_FLEX:"IDP Flex",SUPER_FLEX:"Superflex",SUPERFLEX:"Superflex",REC_FLEX:"WR/TE/RB Flex",WRRB_FLEX:"RB/WR Flex",FLEX:"Flex",BN:"Bench",IR:"Injured Reserve",TAXI:"Taxi"}[String(s).toUpperCase()]||s);
 const positionClass=id=>{const p=pos(id);return ["QB","RB","WR","TE"].includes(p)?"position-"+p:p==="IDP"?"position-IDP":"position-FLEX"};
  const starterSlotNames=(state.league?.roster_positions||[]).filter(s=>!["BN","IR","TAXI","RESERVE"].includes(String(s).toUpperCase()));
  const slotText=s=>({FLEX:"WRT",REC_FLEX:"WRT",WRRB_FLEX:"RB/WR",SUPER_FLEX:"WRTQ",SUPERFLEX:"WRTQ",IDP_FLEX:"IDP",FLEX_IDP:"IDP",BN:"BN",IR:"IR",TAXI:"TAXI",RESERVE:"IR"}[String(s||"").toUpperCase()]||String(s||"—"));
  const starterSlotById={};starters.forEach((id,i)=>{if(id!=null)starterSlotById[String(id)]=starterSlotNames[i]||pos(id)});

iv>'}).join(''):'<div class="empty">'+emptyText+'</div>';
  const slots=(state.league?.roster_positions||[]).filter(s=>!["BN","IR","TAXI","RESERVE"].includes(String(s).toUpperCase()));

  const lineupHtml='<div class="section"><div class="section-head"><h2>Recommended lineup changes</h2><span class="section-total">'+swaps.length+' suggestion'+(swaps.length===1?'':'s')+'</span></div>'+(swaps.length?swaps.map(x=>{const pIn=state.players[x.in.id]||{},pOut=state.players[x.out.id]||{},gIn=state.schedule[pIn.team]||null,gOut=state.schedule[pOut.team]||null;const kickIn=gIn?.date?new Date(gIn.date).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"}):"Kickoff TBD";const kickOut=gOut?.date?new Date(gOut.date).toLocaleString([], {weekday:"short",hour:"numeric",minute:"2-digit"}):"Kickoff TBD";const matchIn=gIn?(gIn.home===pIn.team?"vs "+gIn.away:"@ "+gIn.home):"Matchup TBD";const matchOut=gOut?(gOut.home===pOut.team?"vs "+gOut.away:"@ "+gOut.home):"Matchup TBD";const slotBadge=slotText(x.slot);const slotClass=["QB","RB","WR","TE"].includes(slotBadge)?"position-"+slotBadge:slotBadge==="IDP"?"position-IDP":"position-FLEX";return '<div class="player-row"><div class="position-badge '+slotClass+'">'+esc(slotBadge)+'</div><div class="player-info"><div class="player-name">Start '+esc(playerName(x.in.id))+' <span class="player-team">· '+esc(pos(x.in.id))+' · '+esc(teamName(x.in.id))+'</span></div><div class="game-meta">'+esc(matchIn)+' · '+esc(kickIn)+'</div><div class="player-meta">Replace '+esc(playerName(x.out.id))+' · '+esc(pos(x.out.id))+' · '+esc(teamName(x.out.id))+'<br>'+esc(matchOut)+' · '+esc(kickOut)+'</div></div><div class="projection-box"><div class="projection-number">+'+x.gain.toFixed(1)+'</div><div class="projection-label">proj pts</div></div></div>'}).join(''):'<div class="empty">No higher-projection bench replacements found for an eligible starting slot.</div>')+'<div class="sub" style="padding:0 14px 12px">Suggestions compare projected points for eligible starting slots; moving an existing starter between slots is not counted as a gain.</div></div>';

  lineupHtml+
 '<div class="roster-columns"><div class="section"><div class="section-head"><h2>'+esc(owner)+' · Starters</h2><span class="section-total">'+starters.reduce((sum,id)=>sum+(Number.isFinite(state.weeklyProjection[String(id)])?state.weeklyProjection[String(id)]:0),0).toFixed(1)+'</span></div>'+playerRows(starters,"No starters listed.")+'</div>'+

 (taxi.length?'<div class="section"><h2>Taxi Squad</h2>'+playerRows(taxi,"No taxi squad players.")+'</div>':'')+
 '<div class="section"><h2>League snapshot</h2><div class="team"><div class="teamhead"><span>League teams</span><span>'+state.rosters.length+'</span></div><div class="sub">Current roster data from Sleeper</div></div></div>';

}
function pos(id){const p=state.players[id];return p?.position||"—"}
function teamName(id){const p=state.players[id];return p?.team||"Free agent"}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function closePlayerModal(){document.querySelector(".player-modal-backdrop")?.remove()}
async function openPlayerPanel(id,panel){const p=state.players[id]||{},name=playerName(id);closePlayerModal();const back=document.createElement("div");back.className="player-modal-backdrop";back.innerHTML='<section class="player-modal" role="dialog" aria-modal="true"><div class="player-modal-head"><div><h2>'+esc(name)+'</h2><div class="sub">'+esc(pos(id))+' · '+esc(teamName(id))+(p.injury_status?' · Injury: '+esc(p.injury_status):'')+'</div></div><button class="player-modal-close">Close ✕</button></div><div class="player-modal-body"><div class="empty">Loading…</div></div></section>';document.body.appendChild(back);back.addEventListener("click",e=>{if(e.target===back)closePlayerModal()});back.querySelector(".player-modal-close").addEventListener("click",closePlayerModal);const body=back.querySelector(".player-modal-body");if(panel==="projections"){const h=state.weeklyHistory[String(id)]||[],pr=state.weeklyProjection[String(id)],avg=state.weeklyPPG[String(id)];body.innerHTML='<div class="cards"><div class="card"><div class="kicker">This week projection</div><div class="value">'+(Number.isFinite(pr)?pr.toFixed(1):'—')+'</div></div><div class="card"><div class="kicker">Season avg PPG</div><div class="value">'+(Number.isFinite(avg)?avg.toFixed(1):'—')+'</div></div></div><h3 style="font-size:15px">Previous weekly stats</h3>'+(h.length?h.slice().reverse().map(w=>'<div class="history-row"><span>Week '+w.week+'</span><strong>'+w.points.toFixed(1)+' pts</strong></div>').join(''):'<div class="empty">No weekly stats available for this player.</div>');return}body.innerHTML='<h3 style="font-size:15px">Recent player updates</h3><div class="empty">Searching ESPN news…</div>';try{const res=await fetch("https://site.api.espn.com/apis/site/v2/sports/football/nfl/news?limit=100");if(!res.ok)throw new Error("News feed unavailable");const data=await res.json();const norm=s=>String(s||"").toLowerCase().replace(/[^a-z0-9 ]/g,"").trim();const full=norm(name),last=norm((p.last_name||name.split(" ").slice(-1)[0]));const items=(data.articles||[]).filter(a=>{const text=norm([a.headline,a.description,a.story,a.categories?.map(x=>x.description).join(" ")].join(" "));return full.length>4?text.includes(full):last.length>3&&text.includes(last)}).slice(0,15);body.innerHTML=items.length?items.map(a=>'<div class="history-row" style="display:block"><a href="'+esc(a.links?.web?.href||a.links?.api?.news?.href||"https://www.espn.com/nfl/")+'" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:none">'+esc(a.headline||"NFL news")+'</a>'+(a.published?'<div class="sub">'+esc(new Date(a.published).toLocaleString())+'</div>':'')+(a.description?'<div style="margin-top:5px;font-size:13px">'+esc(a.description)+'</div>':'')+'</div>').join(""):'<div class="empty">No matching recent ESPN headlines found for this player. Try again later; news feeds may not mention every player.</div>'; }catch(e){body.innerHTML='<div class="empty">Could not load recent news right now. ESPN’s news feed may be unavailable in this browser.</div><a href="https://www.espn.com/nfl/" target="_blank" rel="noopener" style="color:var(--accent)">Open ESPN NFL news ↗</a>'}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-player]");if(!b)return;const panel=b.dataset.panel||(b.classList.contains("player-name-open")?"news":"");if(panel)openPlayerPanel(b.dataset.player,panel)});
async function load(){
 const id=$("#league").value;state.tab=document.querySelector("nav button.active")?.dataset.tab||"team";
 $("#content").innerHTML="";status("Loading league, rosters, and player data…");
 try{
  const league=await getJSON("https://api.sleeper.app/v1/league/"+id);
  const [rosters,users]=await Promise.all([getJSON("https://api.sleeper.app/v1/league/"+id+"/rosters"),getJSON("https://api.sleeper.app/v1/league/"+id+"/users")]);
  state.league=league;state.rosters=rosters;state.users=users;
  $("#team").innerHTML=rosters.map(r=>{const u=users.find(x=>x.user_id===r.owner_id)||{};return '<option value="'+r.roster_id+'">'+esc(u.display_name||u.username||("Roster "+r.roster_id))+'</option>'}).join("");
  if(!rosters.some(r=>String(r.roster_id)===String(state.selectedRoster)))state.selectedRoster=String(rosters[0]?.roster_id||"");
  $("#team").value=state.selectedRoster;
  status("League loaded. Fetching player names and dynasty values…");
  if(!Object.keys(state.players).length){state.players=await getJSON("https://api.sleeper.app/v1/players/nfl")}
  try{const market=await getJSON("https://api.statsguyfantasy.com/api/v1/players?tep=blend");state.marketPlayers=Object.fromEntries((market.players||[]).map(p=>[String(p.id),p]));state.marketAsOf=market.valuesAsOf?.sf_dynasty||"";state.marketError=""}catch(err){state.marketError=err.message}
  state.schedule={};
  try{
   const nflStateForSchedule=await getJSON("https://api.sleeper.app/v1/state/nfl").catch(()=>({}));
   const scheduleSeason=Number(nflStateForSchedule.season)||new Date().getFullYear();
   const scheduleWeek=Number(nflStateForSchedule.week)||Number(nflStateForSchedule.display_week)||1;
   const board=await getJSON("https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week="+scheduleWeek+"&seasontype=2&season="+scheduleSeason);
   for(const event of board.events||[]){
    const comp=event.competitions&&event.competitions[0],teams=comp?.competitors||[];
    const home=teams.find(t=>t.homeAway==="home")?.team?.abbreviation,away=teams.find(t=>t.homeAway==="away")?.team?.abbreviation;
    if(!home||!away)continue;
    for(const team of [home,away])state.schedule[team]={home,away,date:event.date};
   }
  }catch(err){diag("Schedule unavailable: "+err.message)}
  const nflState=await getJSON("https://api.sleeper.app/v1/state/nfl").catch(()=>({}));
  const season=Number(nflState.season)||new Date().getFullYear();
  const week=Number(nflState.week)||Number(nflState.display_week)||1;
  diag("Season/week from Sleeper: "+season+" / "+week);
  state.weeklyPPG={};state.weeklyProjection={};
  const summarize=(label,data)=>{const keys=data&&typeof data==="object"?Object.keys(data):[];const first=Array.isArray(data)?data[0]:(keys.length?data[keys[0]]:null);diag(label+": type="+(Array.isArray(data)?"array":typeof data)+", rows="+(Array.isArray(data)?data.length:keys.length)+", first keys="+(first&&typeof first==="object"?Object.keys(first).join(", "):String(first)));};
  try{
   const totals={},counts={},lastWeek=Math.max(1,Math.min(week,18));
   const statWeeks=await Promise.all(Array.from({length:lastWeek},(_,i)=>getJSON("https://api.sleeper.com/stats/nfl/"+season+"/"+(i+1)+"?season_type=regular").catch(err=>{diag("Stats week "+(i+1)+" ERROR: "+err.message);return null})));
   state.weeklyHistory={};
   for(let wi=0;wi<statWeeks.length;wi++){
    const stats=statWeeks[wi];if(!stats||typeof stats!=="object")continue;
    if(wi===0)summarize("Stats response",stats);
    const entries=Array.isArray(stats)?stats.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(stats);
    for(const [key,s] of entries){
     const pid=String(s?.player_id??s?.playerId??s?.id??key);
     const row=s?.stats&&typeof s.stats==="object"?s.stats:s;
     const raw=row?.pts_ppr??row?.pts_half_ppr??row?.pts_std;
     if(raw===undefined||raw===null||pid.startsWith("TEAM_"))continue;
     const pts=Number(raw);if(!Number.isFinite(pts))continue;

     totals[pid]=(totals[pid]||0)+pts;counts[pid]=(counts[pid]||0)+1;
    }
   }
   for(const [pid,total] of Object.entries(totals))if(counts[pid])state.weeklyPPG[pid]=total/counts[pid];
   diag("PPG player rows parsed="+Object.keys(state.weeklyPPG).length);
  }catch(err){diag("Stats parsing ERROR: "+err.message)}
  try{
   const url="https://api.sleeper.com/projections/nfl/"+season+"/"+week+"?season_type=regular";
   const projections=await getJSON(url);summarize("Projection response",projections);
   const entries=Array.isArray(projections)?projections.map((v,i)=>[String(v.player_id??v.playerId??v.id??i),v]):Object.entries(projections||{});
   for(const [key,p] of entries){
    const pid=String(p?.player_id??p?.playerId??p?.id??key),row=p?.stats&&typeof p.stats==="object"?p.stats:p;
    const raw=row?.pts_ppr??row?.pts_half_ppr??row?.pts_std;
    if(raw===undefined||raw===null||pid.startsWith("TEAM_"))continue;
    const points=Number(raw);if(Number.isFinite(points))state.weeklyProjection[pid]=points;
   }
   diag("Projection player rows parsed="+Object.keys(state.weeklyProjection).length);
  }catch(err){diag("Projection ERROR: "+err.message)}
  diag("Player dictionary IDs="+Object.keys(state.players).length+"; PPG IDs="+Object.keys(state.weeklyPPG).length+"; projection IDs="+Object.keys(state.weeklyProjection).length);
  status((league.name||leagueNames[id]||"League")+" loaded · "+rosters.length+" teams · refreshed "+new Date().toLocaleTimeString());
  render();
 }catch(e){status("Could not load data: "+e.message+". Check your connection and try Refresh.");$("#content").innerHTML='<div class="section"><div class="empty">If this persists, the browser may be blocking Sleeper API requests. We can add a small backend if needed.</div></div>'}
}
$("#league").addEventListener("change",()=>{state.selectedRoster="";load()});
$("#team").addEventListener("change",e=>{state.selectedRoster=e.target.value;render()});

document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x===b));state.tab=b.dataset.tab;render()}));
