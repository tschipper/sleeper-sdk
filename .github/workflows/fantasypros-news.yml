name: Refresh FantasyPros Player News

on:
  schedule:
    - cron: "0 5,17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fantasypros-news-refresh
  cancel-in-progress: false

jobs:
  refresh-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch FantasyPros news
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: |
          python - <<'PY'
          import datetime, json, os, sys, urllib.error, urllib.parse, urllib.request
          from pathlib import Path

          key = os.environ.get("FANTASYPROS_API_KEY", "").strip()
          if not key:
              print("Missing repository secret FANTASYPROS_API_KEY. Add it in Settings > Secrets and variables > Actions.")
              sys.exit(1)

          url = "https://api.fantasypros.com/public/v2/json/nfl/news?limit=100"
          req = urllib.request.Request(url, headers={
              "x-api-key": key,
              "Accept": "application/json",
              "User-Agent": "Sleeper-GM-Assistant/1.0"
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except urllib.error.HTTPError as exc:
              print(f"FantasyPros API returned HTTP {exc.code}. Check API key access and endpoint permissions.")
              sys.exit(1)

          if isinstance(payload, list):
              items = payload
          elif isinstance(payload, dict):
              items = next((payload[k] for k in ("news", "articles", "items", "data", "results") if isinstance(payload.get(k), list)), None)
              if items is None:
                  print("Unexpected FantasyPros response shape; refusing to overwrite existing cache.")
                  print("Top-level keys:", list(payload.keys()))
                  sys.exit(1)
          else:
              print("Unexpected FantasyPros response type; refusing to overwrite existing cache.")
              sys.exit(1)

          normalized = []
          for item in items:
              if not isinstance(item, dict):
                  continue
              title = item.get("title") or item.get("headline") or item.get("news_title") or item.get("text")
              if not title:
                  continue
              player = item.get("player") or item.get("player_name") or item.get("name") or ""
              if isinstance(player, dict):
                  player = player.get("name") or player.get("full_name") or ""
              url = item.get("url") or item.get("link") or item.get("news_url") or ""
              normalized.append({
                  "title": str(title),
                  "player": str(player),
                  "url": str(url),
                  "summary": str(item.get("summary") or item.get("description") or item.get("content") or ""),
                  "published": str(item.get("published") or item.get("published_at") or item.get("date") or item.get("timestamp") or ""),
                  "source": str(item.get("source") or "FantasyPros")
              })

          out = {
              "source": "FantasyPros",
              "updated_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "count": len(normalized),
              "articles": normalized
          }
          path = Path("dashboard/data/fantasypros-news.json")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\\n", encoding="utf-8")
          print(f"Cached {len(normalized)} FantasyPros news items.")
          PY

      - name: Commit updated news cache
        run: |
          if git diff --quiet -- dashboard/data/fantasypros-news.json; then
            echo "News cache unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/fantasypros-news.json
          git commit -m "Refresh FantasyPros player news cache"
          git push
