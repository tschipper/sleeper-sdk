name: Refresh NFL usage trends

on:
  schedule:
    - cron: "17 15 * * 2,5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-usage-trends:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build usage trends
        run: python dashboard/scripts/update_usage_data.py
      - name: Commit updated usage data
        run: |
          if git diff --quiet -- dashboard/data/usage-trends.json; then
            echo "Usage data unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data/usage-trends.json
          git commit -m "Refresh NFL usage trend data"
          git push
